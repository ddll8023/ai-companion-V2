appId: com.ai-companion.app
productName: AI Companion
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  hardenedRuntime: true
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
    - deb
  category: Utility
